/* ============================== AI RULES ENGINE ============================== */
function trend(history){
  if (!history || history.length<2) return 'flat';
  const delta = history[history.length-1] - history[0];
  if (delta >= 6) return 'improving';
  if (delta <= -6) return 'declining';
  return 'flat';
}
function riskLevel(score){
  if (score < 60) return 'high';
  if (score < 70) return 'moderate';
  return 'low';
}
function computeStudentInsights(student){
  const insights = [];
  student.subjects.forEach(sub=>{
    const overall = Math.round((sub.assignmentAvg + sub.examAvg)/2);
    const t = trend(sub.examHistory);
    if (overall < 65) {
      insights.push({
        id:`weak-${sub.name}`, category:'weak_subject', severity: overall<60?'high':'moderate',
        title:`${sub.name} is a weak subject`,
        metric:`Assignment avg ${sub.assignmentAvg}% · Exam avg ${sub.examAvg}%`,
        recommendation: `Book office hours this week and rework the last two problem sets before the next assessment.`,
        trend:t,
      });
    }
    if (t==='improving' && overall>=65) {
      insights.push({
        id:`up-${sub.name}`, category:'improving', severity:'positive',
        title:`${sub.name} performance is improving`,
        metric:`Exam scores trending ${sub.examHistory.join(' → ')}`,
        recommendation:`Keep the current study routine — this trajectory puts you on track for a strong final grade.`,
        trend:t,
      });
    }
    if (t==='declining') {
      insights.push({
        id:`down-${sub.name}`, category:'declining', severity: overall<65?'high':'moderate',
        title:`${sub.name} performance is declining`,
        metric:`Exam scores trending ${sub.examHistory.join(' → ')}`,
        recommendation:`Identify the specific topics behind the drop and schedule a review session before it compounds.`,
        trend:t,
      });
    }
  });
  if (student.attendance < 75) {
    insights.push({
      id:'attendance', category:'risk', severity: student.attendance<65?'high':'moderate',
      title:'Attendance is below the recommended threshold',
      metric:`Current attendance: ${student.attendance}% (recommended: 75%+)`,
      recommendation:`Attendance below 75% is linked to a measurable drop in exam performance — prioritize consistent class presence this month.`,
      trend:'flat',
    });
  }
  const overallRisk = Math.round(
    (student.subjects.reduce((a,s)=>a+((s.assignmentAvg+s.examAvg)/2),0)/student.subjects.length) * 0.6
    + student.attendance * 0.4
  );
  insights.unshift({
    id:'overall', category:'risk_summary', severity: riskLevel(overallRisk)==='high'?'high':riskLevel(overallRisk)==='moderate'?'moderate':'positive',
    title: riskLevel(overallRisk)==='high' ? 'Academic risk: elevated' : riskLevel(overallRisk)==='moderate' ? 'Academic risk: moderate' : 'Academic risk: low',
    metric:`Composite academic index: ${overallRisk}/100`,
    recommendation: riskLevel(overallRisk)==='high'
      ? 'Recommend a check-in with your academic advisor this week to build a recovery plan.'
      : riskLevel(overallRisk)==='moderate'
      ? 'A few focused adjustments in your weakest subject should move this back into a comfortable range.'
      : 'You are on a healthy academic trajectory — maintain current habits.',
    trend:'flat',
  });
  return insights;
}
function computeClassInsights(){
  const atRisk = ROSTER.filter(s=>s.avg<65 || s.attendance<70);
  const improving = [...ROSTER].sort((a,b)=>b.avg-a.avg)[0];
  const weakest = [...ROSTER].sort((a,b)=>a.avg-b.avg)[0];
  const classAvg = Math.round(ROSTER.reduce((a,s)=>a+s.avg,0)/ROSTER.length);
  return [
    { id:'ci1', category:'risk_summary', severity: atRisk.length>2?'high':'moderate', title:`${atRisk.length} student${atRisk.length===1?'':'s'} flagged at academic risk`,
      metric:`Class average: ${classAvg}% · Threshold: 65%`, recommendation:`Prioritize outreach to ${atRisk.map(s=>s.name).slice(0,3).join(', ')}${atRisk.length>3?' and others':''} before the next assessment.` },
    { id:'ci2', category:'weak_subject', severity:'moderate', title:`${weakest.name} needs the most support`,
      metric:`Current average: ${weakest.avg}% · Attendance: ${weakest.attendance}%`, recommendation:`Consider a targeted 1:1 review session focused on foundational gaps.` },
    { id:'ci3', category:'improving', severity:'positive', title:`${improving.name} is leading the class`,
      metric:`Current average: ${improving.avg}% · Attendance: ${improving.attendance}%`, recommendation:`A strong candidate for peer-mentoring lower-performing students.` },
  ];
}
function computeInstitutionInsights(){
  const atRisk = ROSTER.filter(s=>s.avg<65 || s.attendance<70).length;
  return [
    { id:'ii1', category:'risk_summary', severity:'high', title:`${atRisk} students across sampled cohort flagged at risk`,

  ];
}

function Button({ children, variant='primary', size='md', className='', icon, ...rest }){

  const sizes = { sm:"text-sm px-3 py-1.5", md:"text-sm px-4 py-2.5", lg:"text-base px-5 py-3" };
  const variants = {
    primary: "bg-ink-900 text-white hover:bg-ink-800 shadow-card",
    accent: "bg-cobalt-500 text-white hover:bg-cobalt-600 shadow-card",
    secondary: "bg-white text-ink-800 border border-ink-150 hover:border-ink-300 hover:bg-ink-50",
    ghost: "text-ink-600 hover:bg-ink-100 hover:text-ink-900",
    danger: "bg-white text-rose-600 border border-rose-100 hover:bg-rose-50",
  };
  return <button className={cx(base, sizes[size], variants[variant], className)} {...rest}>
    {icon && <Icon name={icon} size={16} />}{children}
  </button>;
}

function Badge({ children, tone='neutral', className='' }){

  };
  return <span className={cx("inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full", tones[tone], className)}>{children}</span>;
}

function Card({ children, className='', hover=false, ...rest }){
  return <div className={cx("bg-white border border-ink-150 rounded-2xl shadow-card", hover && "transition-all duration-200 hover:shadow-hover hover:-translate-y-0.5", className)} {...rest}>{children}</div>;
}

function StatCard({ label, value, sub, trendDir, delay=0 }){
  return (
    <Card className="p-5 anim-fadeUp" style={{animationDelay:`${delay}ms`}} hover>
      <div className="text-xs font-medium text-ink-500 uppercase tracking-wide">{label}</div>

          <span className={cx("flex items-center gap-0.5 text-xs font-medium mb-1", trendDir==='up' ? 'text-sage-600' : trendDir==='down' ? 'text-rose-600' : 'text-ink-400')}>
            <Icon name={trendDir==='up'?'trendUp':trendDir==='down'?'trendDown':'chart'} size={13} strokeWidth={2} />
          </span>
        )}
      </div>
      {sub && <div className="mt-1 text-xs text-ink-500">{sub}</div>}
    </Card>
  );
}

function EmptyState({ icon='file', title, sub, action }){

}

function ComingSoon({ title }){
  return <EmptyState icon="settings" title={`${title} is in development`} sub="This section is scoped for a later build phase and intentionally left out of this pass rather than shipped half-built." />;
}

function Toast({ toasts }){
  return (
    <div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 items-end">
      {toasts.map(t=>(
        <div key={t.id} className="anim-slideInRight bg-ink-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-pop flex items-center gap-2">
          <Icon name="check" size={15} className="text-sage-400" />{t.msg}
        </div>
      ))}
    </div>
  );
}

function Modal({ open, onClose, title, children, wide }){
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-ink-950/40 anim-fadeIn" onClick={onClose}></div>
      <div className={cx("relative bg-white rounded-2xl shadow-pop w-full anim-scaleIn max-h-[85vh] overflow-y-auto", wide ? "max-w-2xl" : "max-w-md")}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-ink-150 sticky top-0 bg-white rounded-t-2xl">
          <h3 className="font-display font-semibold text-ink-900">{title}</h3>
          <button onClick={onClose} className="text-ink-400 hover:text-ink-800 transition-colors"><Icon name="x" size={18} /></button>

/* ---- Insight Card (signature component) ---- */
function severityColor(sev){
  return { high:'rose', moderate:'amber', positive:'sage', low:'sage' }[sev] || 'cobalt';
}
function InsightCard({ insight, delay=0 }){
  const tone = severityColor(insight.severity);
  const dotColor = { rose:'bg-rose-500', amber:'bg-amber-500', sage:'bg-sage-500', cobalt:'bg-cobalt-500' }[tone];
  const borderColor = { rose:'border-l-rose-500', amber:'border-l-amber-500', sage:'border-l-sage-500', cobalt:'border-l-cobalt-500' }[tone];
  const trendIcon = insight.trend==='improving' ? 'trendUp' : insight.trend==='declining' ? 'trendDown' : null;
  return (
    <Card className={cx("p-5 border-l-4 anim-fadeUp", borderColor)} style={{animationDelay:`${delay}ms`}} hover>
      <div className="flex items-start gap-3">
        <span className={cx("mt-1.5 w-2 h-2 rounded-full flex-shrink-0 pulse-dot", dotColor)}></span>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between gap-2">
            <h4 className="font-display font-semibold text-ink-900 text-[15px]">{insight.title}</h4>
            {trendIcon && <Icon name={trendIcon} size={15} className={tone==='sage'?'text-sage-500':'text-rose-500'} />}
          </div>
          <p className="font-mono text-xs text-ink-500 mt-1.5">{insight.metric}</p>
          <p className="text-sm text-ink-600 mt-2.5 leading-relaxed">{insight.recommendation}</p>
        </div>
      </div>
    </Card>
  );
}

/* ---- Simple SVG charts (no external chart lib needed) ---- */
function LineChart({ data, width=100, height=64, color="#4361EE" }){
  const max = Math.max(...data, 100), min = Math.min(...data, 0);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*width;
    const y = height - ((v-min)/(max-min || 1))*height;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-16 overflow-visible">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="draw-line" />
      {data.map((v,i)=>{
        const x = (i/(data.length-1))*width;
        const y = height - ((v-min)/(max-min || 1))*height;
        return <circle key={i} cx={x} cy={y} r="2.5" fill={color} />;
      })}
    </svg>
  );
}
function BarChart({ data, labels, color="#4361EE" }){
  const max = Math.max(...data.map(d=>d), 100);
  return (
    <div className="flex items-end gap-3 h-40 px-1">
      {data.map((v,i)=>(
        <div key={i} className="flex-1 flex flex-col items-center gap-2">
          <div className="w-full flex-1 flex items-end">
            <div className="w-full rounded-t-md transition-all duration-700 ease-out" style={{height:`${(v/max)*100}%`, background:color, minHeight:'4px'}}></div>
          </div>
          <span className="text-[11px] text-ink-500 font-medium">{labels[i]}</span>
        </div>
      ))}
    </div>
  );
}

function TeacherAttendance(){
  const [marks, setMarks] = useState(Object.fromEntries(ROSTER.map(s=>[s.id,'present'])));
  const [toasts, setToasts] = useState([]);
  const push = (msg) => { const id = Date.now(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2500); };
  const cycle = (id) => setMarks(m=>({...m, [id]: m[id]==='present'?'late':m[id]==='late'?'absent':'present'}));
  const styles = { present:'bg-sage-100 text-sage-600', late:'bg-amber-100 text-amber-600', absent:'bg-rose-100 text-rose-600' };
  return (
    <Card className="p-6 anim-fadeUp">
      <SectionHeading action={<Button variant="accent" size="sm" onClick={()=>push('Attendance saved for today')}>Save attendance</Button>}>Today — Mathematics 201</SectionHeading>
      <div className="divide-y divide-ink-100">
        {ROSTER.map(s=>(
          <div key={s.id} className="flex items-center justify-between py-3">
            <span className="text-sm font-medium text-ink-800">{s.name}</span>
            <button onClick={()=>cycle(s.id)} className={cx("text-xs font-medium px-3 py-1.5 rounded-full capitalize transition-colors w-24", styles[marks[s.id]])}>
              {marks[s.id]}
            </button>
          </div>
        ))}
      </div>
      <p className="text-xs text-ink-400 mt-3">Tap a status to cycle present → late → absent.</p>
      <Toast toasts={toasts} />
    </Card>
  );
}

              <div className="w-10 h-10 rounded-xl bg-cobalt-100 text-cobalt-600 flex items-center justify-center mb-4"><Icon name={r.icon} size={19}/></div>
              <h3 className="font-display font-semibold text-ink-900 mb-1.5">{r.role}</h3>
              <p className="text-sm text-ink-600 leading-relaxed">{r.desc}</p>
            </Card>
          ))}
        </div>
      </section>
    </div>
  );
}

function PublicCourses({ setView }){
  return (
    <div className="max-w-6xl mx-auto px-5 md:px-8 py-16">
      <h1 className="font-display font-bold text-3xl text-ink-950 mb-2">Course Catalog</h1>
      <p className="text-ink-600 mb-8">Browse what's available this term.</p>
      <div className="grid sm:grid-cols-2 gap-4 stagger in">
        {COURSES.map(c=>(
          <Card key={c.id} className="p-5" hover onClick={()=>setView({page:'courseDetail', id:c.id})} style={{cursor:'pointer'}}>
            <Badge tone="cobalt">{c.code}</Badge>
            <h3 className="font-display font-semibold text-ink-900 mt-2">{c.title}</h3>
            <p className="text-sm text-ink-500 mt-1.5 line-clamp-2">{c.desc}</p>
            <p className="text-xs text-ink-400 mt-3">{teacherById(c.teacherId).name} · {c.credits} credits</p>
          </Card>
        ))}
      </div>
    </div>
  );
}

function PublicCourseDetail({ id, setView }){
  const c = courseById(id);
  return (
    <div className="max-w-3xl mx-auto px-5 md:px-8 py-16 anim-fadeUp">
      <button className="text-sm text-ink-500 hover:text-ink-800 flex items-center gap-1 mb-6" onClick={()=>setView({page:'courses'})}>← Back to courses</button>
      <Badge tone="cobalt">{c.code}</Badge>
      <h1 className="font-display font-bold text-3xl text-ink-950 mt-3">{c.title}</h1>
      <p className="text-ink-600 mt-4 leading-relaxed">{c.desc}</p>
      <div className="grid grid-cols-3 gap-3 mt-6">
        <div className="bg-white border border-ink-150 rounded-xl p-4"><div className="text-xs text-ink-500">Instructor</div><div className="text-sm font-medium mt-1">{teacherById(c.teacherId).name}</div></div>
        <div className="bg-white border border-ink-150 rounded-xl p-4"><div className="text-xs text-ink-500">Department</div><div className="text-sm font-medium mt-1">{c.dept}</div></div>
        <div className="bg-white border border-ink-150 rounded-xl p-4"><div className="text-xs text-ink-500">Credits</div><div className="text-sm font-medium mt-1">{c.credits}</div></div>
      </div>
      <Button variant="accent" size="lg" className="mt-8" onClick={()=>setView({page:'login'})}>Enroll — sign in to continue</Button>
    </div>
  );
}

function PublicContact(){
  return (
    <div className="max-w-lg mx-auto px-5 md:px-8 py-16 anim-fadeUp">
      <h1 className="font-display font-bold text-3xl text-ink-950 mb-2">Contact</h1>
      <p className="text-ink-600 mb-8">Questions about EduIQ? Reach out.</p>
      <Card className="p-6 space-y-3">
        <input placeholder="Your name" className="w-full border border-ink-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cobalt-300" />
        <input placeholder="Email" className="w-full border border-ink-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cobalt-300" />
        <textarea placeholder="Message" rows="4" className="w-full border border-ink-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cobalt-300"></textarea>
        <Button variant="accent" className="w-full" icon="mail">Send message</Button>
      </Card>
    </div>
  );
}

function LoginPage({ onLogin }){
  const [role, setRole] = useState(null);
  return (
    <div className="min-h-[80vh] flex items-center justify-center px-5 py-16">
      <Card className="p-8 w-full max-w-sm anim-scaleIn">
        <div className="w-10 h-10 rounded-xl bg-cobalt-500 flex items-center justify-center mb-5"><Icon name="sparkles" size={19} className="text-white"/></div>
        <h1 className="font-display font-bold text-2xl text-ink-950">Sign in to EduIQ</h1>
        <p className="text-sm text-ink-500 mt-1.5 mb-6">Demo mode — choose a role to explore its experience.</p>
        <div className="space-y-2.5">
          {[
            { key:'student', label:'Student', icon:'user', desc:'Maya Whitfield' },
            { key:'teacher', label:'Teacher', icon:'users', desc:'Dr. Elena Marsh' },
            { key:'admin', label:'Administrator', icon:'cap', desc:'System Admin' },
          ].map(r=>(
            <button key={r.key} onClick={()=>setRole(r.key)}
              className={cx("w-full flex items-center gap-3 p-3.5 rounded-xl border text-left transition-all duration-150",
                role===r.key ? "border-cobalt-400 bg-cobalt-50" : "border-ink-150 hover:border-ink-300")}>
              <div className={cx("w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0", role===r.key ? "bg-cobalt-500 text-white" : "bg-ink-100 text-ink-500")}>
                <Icon name={r.icon} size={17}/>
              </div>
              <div>
                <div className="text-sm font-medium text-ink-900">{r.label}</div>
                <div className="text-xs text-ink-500">{r.desc}</div>
              </div>
            </button>
          ))}
        </div>
        <Button variant="accent" className="w-full mt-5" disabled={!role} onClick={()=>onLogin(role)}>Continue<Icon name="arrowRight" size={15}/></Button>
      </Card>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function App(){
  const [session, setSession] = useState(null);
  const [view, setView] = useState({ page:'home' });

  if (session) {
    return <AppShell role={session} onLogout={()=>setSession(null)} />;
  }

  return (
    <div className="min-h-screen bg-ink-50">
      <PublicNav setView={setView} />
      {view.page==='home' && <HomePage setView={setView} />}
      {view.page==='courses' && <PublicCourses setView={setView} />}
      {view.page==='courseDetail' && <PublicCourseDetail id={view.id} setView={setView} />}
      {view.page==='contact' && <PublicContact />}
      {view.page==='login' && <LoginPage onLogin={(role)=>setSession(role)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
